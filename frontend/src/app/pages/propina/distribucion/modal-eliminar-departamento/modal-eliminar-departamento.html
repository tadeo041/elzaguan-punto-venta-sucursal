<div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[9999] p-4">
    <div class="bg-modal-bg-body w-full max-w-[420px] rounded-2xl shadow-2xl flex flex-col overflow-hidden relative animate-fade-in p-6 gap-4">
        
        <!-- Cuerpo del Modal -->
        <div class=" flex flex-col items-center text-center gap-4">
            
            <!-- Icono de advertencia -->
            <div class="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                </svg>
            </div>

            <div>
                <h2 class="text-xl font-bold text-modal-encabezado mb-2">¿Eliminar departamento?</h2>
                <p class="text-sm text-modal-parrafo">
                    Estás a punto de eliminar el departamento <strong class="text-gray-900">"{{ departamento?.name }}"</strong>. 
                    Esta acción no se puede deshacer y los cálculos de distribución se actualizarán.
                </p>
            </div>

            @if (errorMessage) {
                <div class="w-full text-input-error-text text-sm font-semibold bg-input-error-bg p-3 rounded-lg border border-input-error-border">
                    {{ errorMessage }}
                </div>
            }
        </div>

        <!-- Botones -->
        <div class="flex justify-center gap-3">
            <button (click)="cerrarModal()" [disabled]="isLoading" 
                class="px-6 py-2.5 w-full bg-btn-secondary border border-btn-secondary-border text-btn-secondary-text font-medium rounded-lg hover:bg-btn-secondary-hover transition-colors cursor-pointer">
                No, conservarla
            </button>
            <button (click)="confirmarEliminacion()" [disabled]="isLoading"
                class="px-6 py-2.5 w-full bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition-colors cursor-pointer flex items-center justify-center min-w-[100px]">
                @if (isLoading) {
                    <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                } @else {
                    Si, eliminar
                }
            </button>
        </div>
    </div>
</div>
