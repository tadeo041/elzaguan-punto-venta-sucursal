<!-- Contenedor principal -->
<div class="flex w-full min-h-screen p-2 bg-bg-body">

  <!-- Columna Izquierda (Imagen) -->
  <div class="hidden md:flex md:w-1/2 relative flex-col p-6 bg-cover bg-center rounded-lg overflow-hidden" 
    style="background-image: url('/sucursales/sucursal-1.jpg');">
    
    <!-- Filtro oscuro para que el texto resalte -->
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- Contenido sobre la imagen -->
    <div class="relative z-10 text-white flex flex-col justify-between h-full">
      
      <!-- Logo -->
      <img src="/logo/logo-blanco.svg" alt="logo ElZaguán" class="h-20 w-20">
      
      <!-- Carrusel frases -->
      <div class="flex flex-col gap-4">
        <h1 *ngIf="frases[fraseActual] as frase" 
            class="text-2xl font-semibold text-icon-inverse animate-fade">
          {{ frase }}
        </h1>
        
        <!-- Puntitos indicadores -->
        <div class="flex gap-2">
          <div *ngFor="let f of frases; let i = index" 
               class="h-2 rounded-full transition-all duration-300 cursor-pointer"
               [ngClass]="i === fraseActual ? 'w-8 bg-primary' : 'w-2 bg-white/40 hover:bg-white/70'"
               (click)="fraseActual = i">
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Columna Derecha (Formulario) -->
  <div class="w-full md:w-1/2 flex items-center justify-center p-8 bg-bg-login rounded-lg">
    
    <div class="w-full max-w-md">
      <div class="flex flex-col gap-4 mb-8">
        <h2 class="text-4xl font-bold text-primary text-center">Iniciar Sesión</h2>
        <p class="text-lg text-body font-medium">Ingresa tu usuario y contraseña para poder acceder al sistema.</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-6">
        
        <!-- Input: Usuario -->
        <div class="flex flex-col">
          <label class="mb-2 font-semibold text-label">Usuario</label>
          <input type="text" [(ngModel)]="credentials.username" name="username" required
            class="px-4 py-2.5 bg-input-bg border border-input-border text-input-text placeholder-input-placeholder rounded-lg 
                  focus:outline-none focus:border-input-focus-border focus:ring-2 focus:ring-input-focus-ring transition-all"
            placeholder="Ingresa tu usuario">
        </div>

        <!-- Input: Contraseña -->
        <div class="flex flex-col">
          <label class="mb-2 font-semibold text-label">Contraseña</label>
          <input type="password" [(ngModel)]="credentials.password" name="password" required
            class="px-4 py-2.5 bg-input-bg border border-input-border text-input-text placeholder-input-placeholder rounded-lg 
                   focus:outline-none focus:border-input-focus-border focus:ring-2 focus:ring-input-focus-ring transition-all"
            placeholder="••••••••">
        </div>

        <!-- Mensaje de error -->
        <div *ngIf="errorMessage" class="text-input-error-text text-sm font-semibold bg-input-error-bg p-3 rounded-md border border-input-error-border">
          {{ errorMessage }}
        </div>

        <!-- Botón primario -->
        <button type="submit" [disabled]="isLoading"
          class="w-full bg-btn-primary hover:bg-btn-primary-hover active:bg-btn-primary-active text-btn-primary-text font-bold py-3 px-4 rounded-lg transition duration-200 
                disabled:bg-btn-primary-disabled disabled:text-btn-secondary-text-disabled disabled:cursor-not-allowed cursor-pointer">
          {{ isLoading ? 'Iniciando sesión...' : 'Iniciar sesión' }}
        </button>

      </form>    
    </div>
  </div>

</div>
