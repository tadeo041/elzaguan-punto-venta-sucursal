<!-- Contenedor principal -->
<div class="flex w-full min-h-screen p-2 bg-bg-body">

  <!-- Columna Izquierda (Imagen) -->
  <div class="hidden md:flex md:w-1/2 relative flex-col p-6 bg-cover bg-center rounded-lg overflow-hidden"
    style="background-image: url('sucursales/sucursal-1.jpg');">

    <!-- Filtro oscuro para que el texto resalte -->
    <div class="absolute inset-0 bg-black/50"></div>

    <!-- Contenido sobre la imagen -->
    <div class="relative z-10 text-white flex flex-col justify-between h-full">

      <!-- Logo -->
      <img src="logo/logoInicioSesion.svg" alt="logo ElZaguán" class="size-24">

      <!-- Carrusel frases -->
      <div class="flex flex-col gap-4">
        <h1 *ngIf="frases[fraseActual] as frase"
            class="text-2xl font-semibold text-icon-inverse animate-fade">
          {{ frase }}
        </h1>

        <!-- Puntitos indicadores -->
        <div class="flex gap-2">
          <div *ngFor="let f of frases; let i = index"
               class="h-2 rounded-full transition-all duration-300 cursor-pointer"
               [ngClass]="i === fraseActual ? 'w-8 bg-primary' : 'w-2 bg-white/40 hover:bg-white/70'"
               (click)="fraseActual = i">
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Columna Derecha (Formulario) -->
  <div class="w-full md:w-1/2 flex items-center justify-center p-8 bg-bg-login rounded-lg">

    <div class="w-full max-w-md">
      <div class="flex flex-col gap-4 mb-8">
        <h2 class="text-4xl font-bold text-primary text-center">Iniciar Sesión</h2>
        <p class="text-lg text-body font-medium">Ingresa tu usuario y contraseña para poder acceder al sistema.</p>

        <!-- Tooltip de alerta debajo del encabezado (solo cuando hay error) -->
        <div *ngIf="errorMessage"
             class="flex items-start gap-2 text-input-error-text text-sm font-semibold bg-input-error-bg p-3 rounded-md border border-input-error-border">
          <!-- Icono de alerta -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="1.5" stroke="currentColor" class="size-5 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
          </svg>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Mensaje de éxito (verde) con icono check -->
        <div *ngIf="successMessage"
             class="flex items-start gap-2 text-green-700 text-sm font-semibold bg-green-50 p-3 rounded-md border border-green-300">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="1.5" stroke="currentColor" class="size-5 shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
          <span>{{ successMessage }}</span>
        </div>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-6">

        <!-- Input: Usuario con icono -->
        <div class="flex flex-col">
          <label class="mb-2 font-semibold text-label">Usuario</label>
          <div class="relative">
            <!-- Icono de usuario -->
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
                  [ngClass]="errorMessage ? 'text-red-500' : 'text-gray-400'">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                   stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
              </svg>
            </span>
            <input type="text" [(ngModel)]="credentials.username" name="username" required
              class="w-full pl-10 pr-4 py-2.5 bg-input-bg border rounded-lg transition-all
                     focus:outline-none focus:ring-2"
              [ngClass]="errorMessage
                ? 'border-red-500 text-red-600 placeholder-red-400 focus:border-red-500 focus:ring-red-300'
                : 'border-input-border text-input-text placeholder-input-placeholder focus:border-input-focus-border focus:ring-input-focus-ring'"
              placeholder="Ingresa tu usuario">
          </div>
        </div>

        <!-- Input: Contraseña con icono y toggle -->
        <div class="flex flex-col">
          <label class="mb-2 font-semibold text-label">Contraseña</label>
          <div class="relative">
            <!-- Icono de candado -->
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
                  [ngClass]="errorMessage ? 'text-red-500' : 'text-gray-400'">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                   stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
              </svg>
            </span>

            <input [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="credentials.password" name="password" required
              class="w-full pl-10 pr-12 py-2.5 bg-input-bg border rounded-lg transition-all
                     focus:outline-none focus:ring-2"
              [ngClass]="errorMessage
                ? 'border-red-500 text-red-600 placeholder-red-400 focus:border-red-500 focus:ring-red-300'
                : 'border-input-border text-input-text placeholder-input-placeholder focus:border-input-focus-border focus:ring-input-focus-ring'"
              placeholder="••••••••">

            <!-- Botón toggle ver/ocultar contraseña -->
            <button type="button" (click)="togglePassword()"
              class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer"
              [ngClass]="errorMessage ? 'text-red-500 hover:text-red-600' : 'text-gray-400 hover:text-gray-600'">
              <!-- Ojo abierto (mostrar) -->
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none"
                   viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
              <!-- Ojo tachado (ocultar) -->
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none"
                   viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Botón primario -->
        <button type="submit" [disabled]="isLoading"
          class="w-full bg-btn-primary hover:bg-btn-primary-hover active:bg-btn-primary-active text-btn-primary-text font-bold py-3 px-4 rounded-lg transition duration-200
                disabled:bg-btn-primary-disabled disabled:text-btn-secondary-text-disabled disabled:cursor-not-allowed cursor-pointer">
          {{ isLoading ? 'Iniciando sesión...' : 'Iniciar sesión' }}
        </button>

      </form>
    </div>
  </div>

</div>
