<header class="h-20 bg-header-bg  flex items-center justify-between px-6 relative z-40">
  <!-- lado izquierdo: logo y titulo -->
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 bg-header-bg-icon text-header-icon rounded-xl flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
      </svg>
    </div>
    <div>
      <div class="flex items-center gap-2">
        <h2 class="text-lg font-bold text-heading leading-tight">Punto de Venta</h2>
        <span class="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider text-chip-amarillo-text bg-chip-amarillo-bg rounded-md">
          Beta
        </span>
      </div>
      <p class="text-xs text-muted">Panel de gerente</p>
    </div>
  </div>

  <!-- lado derecho: perfil y cerrar sesion -->
  <div class="flex items-center gap-2">
    
    <!-- perfil de usuario -->
    <div class="flex items-center gap-3 pr-3 ">
      
      <!-- avatar -->
      <div class="w-10 h-10 bg-primary border-2 border-white text-btn-primary-text rounded-full flex items-center justify-center font-bold text-sm tracking-wider uppercase">
        {{ iniciales }}
      </div>

      <!-- nombre y rol -->
      <div class="text-left hidden sm:block">
        <p class="text-sm font-semibold text-heading leading-tight">{{ nombreUsuario }}</p>
        <p class="text-xs text-muted">{{ rolUsuario }}</p>
      </div>
    </div>
    <div class="h-8 border-border-general border"></div>
    <!-- boton cerrar sesion -->
    <button (click)="cerrarSesion()" 
            class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-btn-icon-text hover:text-chip-rojo-text hover:bg-chip-rojo-bg rounded-lg transition-colors cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="size-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
      </svg>
      Cerrar sesión
    </button>
  </div>
</header>
