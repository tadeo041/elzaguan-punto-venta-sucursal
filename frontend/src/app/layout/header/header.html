<header class="h-16 bg-bg-secundario flex items-center justify-between px-6">
  <!-- Lado Izquierdo -->
  <div class="flex items-center gap-4">
    <h2 class="text-xl font-bold text-text-h1">Punto de Venta</h2>
  </div>

  <!-- Lado Derecho: Info del usuario y Cerrar Sesión -->
  <div class="flex items-center gap-4">
    <!-- Botón de notificaciones -->
    <button class="p-2 text-text-muted hover:bg-bg-principal rounded-full transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
    </button>

    <!-- Perfil de usuario -->
    <div class="flex items-center gap-3 border-l border-border-general pl-4">
      <div class="text-right hidden sm:block">
        <p class="text-sm font-bold text-text-h3">Manuel</p>
        <p class="text-xs text-text-caption">Gerente</p>
      </div>
      <div class="w-10 h-10 bg-primario text-white rounded-full flex items-center justify-center font-bold">
        M
      </div>
    </div>

    <!-- Botón de Cerrar Sesión -->
    <button (click)="cerrarSesion()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors cursor-pointer ml-2">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
      </svg>
      Cerrar sesión
    </button>
  </div>
</header>
