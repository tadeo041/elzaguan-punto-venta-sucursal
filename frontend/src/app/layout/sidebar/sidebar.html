<aside [ngClass]="isCollapsed ? 'w-20' : 'w-64'"
    class="bg-sidebar-bg text-sidebar-text flex flex-col h-full transition-all duration-300 relative z-50 font-medium">

    <div class="h-24 flex items-center justify-center relative w-full px-4 border-b border-border-general shrink-0">
        
        <div *ngIf="!isCollapsed" class="w-full h-full flex items-center justify-center p-3">
            <img src="/logo/logoSidebarAbierto.svg" alt="El Zaguán" class="w-full h-full object-contain">
        </div>

        <div *ngIf="isCollapsed" class="w-full h-full flex items-center justify-center">
            <img src="/logo/logoSidebarCerrado.svg" alt="El Zaguán" class="w-14 h-14 object-contain">
        </div>

        <button (click)="toggleSidebar()"
            class="absolute -right-3 top-8 bg-bg-secundario border border-border-general rounded-full p-1 text-text-caption hover:text-primario shadow-sm transition-colors z-50">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform duration-300"
                [ngClass]="isCollapsed ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </button>
    </div>

    <div class="flex-1 relative overflow-visible">
        
        <div class="absolute inset-0 overflow-y-auto overflow-x-hidden p-4 flex flex-col gap-1 pb-10">

            <div *ngIf="!isCollapsed" class="px-2 mb-2 mt-2">
                <p class="text-[.625rem] font-medium tracking-wider uppercase">General</p>
            </div>

            <!-- Propina -->
            <div class="relative group">
                <button (click)="toggleMenu('propina')"
                    class="w-full flex items-center justify-between px-3 py-3 rounded-lg transition-colors hover:bg-sidebar-hover-bg hover:text-sidebar-hover-text"
                    [ngClass]="(!isCollapsed && menuAbierto === 'propina') || (isCollapsed && menuColapsadoAbierto === 'propina') ? 'text-sidebar-active-text font-semibold bg-sidebar-active-bg' : ''">
                    <div class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 shrink-0">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z" />
                        </svg>
                        <span *ngIf="!isCollapsed">Propina</span>
                    </div>
                    <svg *ngIf="!isCollapsed" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform shrink-0"
                        [ngClass]="menuAbierto === 'propina' ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>

                <div *ngIf="isCollapsed && menuColapsadoAbierto !== 'propina'" 
                     class="fixed ml-14 -mt-10 px-3 py-1.5 bg-black text-white text-xs font-medium rounded-md opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-[9999] shadow-lg hidden group-hover:block">
                    Propina
                    <div class="absolute top-1/2 -left-1.5 -translate-y-1/2 w-0 h-0 border-y-[6px] border-y-transparent border-r-[6px] border-r-black"></div>
                </div>

                <div *ngIf="menuAbierto === 'propina' && !isCollapsed" class="flex gap-2 pl-4.5 pr-1 py-2">
                    <div class=" left-[1.1rem] top-0 bottom-4 w-px bg-border-general"></div>
                    <div class="flex flex-col gap-1 w-full">
                        <a href="#" class="px-3 py-2 text-sm text-sidebar-active-text bg-sidebar-active-bg rounded-lg font-semibold">Panel general</a>
                        <a href="#" class="px-3 py-2 text-sm rounded-lg hover:bg-sidebar-hover-bg hover:text-sidebar-hover-text transition-colors">Distribución</a>
                        <a href="#" class="px-3 py-2 text-sm rounded-lg hover:bg-sidebar-hover-bg hover:text-sidebar-hover-text transition-colors">Reportes</a>
                    </div>
                </div>

                <!-- Bandeja flotante (Fixed, alineada al tope y más cerca del sidebar) -->
                <div *ngIf="isCollapsed && menuColapsadoAbierto === 'propina'" 
                     class="fixed left-[5.2rem] -mt-11 w-48 bg-white rounded-xl shadow-lg border border-gray-100 p-2 z-[9999] flex flex-col gap-1">
                    <a href="#" class="px-4 py-2 text-sm text-gray-800 hover:bg-gray-100 rounded-lg transition-colors">Panel general</a>
                    <a href="#" class="px-4 py-2 text-sm text-gray-800 hover:bg-gray-100 rounded-lg transition-colors">Distribución</a>
                    <a href="#" class="px-4 py-2 text-sm text-gray-800 hover:bg-gray-100 rounded-lg transition-colors">Reportes</a>
                </div>
            </div>

            <!-- Inventario -->
            <div class="relative group">
                <button (click)="toggleMenu('inventario')"
                    class="w-full flex items-center justify-between px-3 py-3 rounded-lg transition-colors hover:bg-sidebar-hover-bg hover:text-sidebar-hover-text"
                    [ngClass]="(!isCollapsed && menuAbierto === 'inventario') || (isCollapsed && menuColapsadoAbierto === 'inventario') ? 'text-sidebar-active-text font-semibold bg-sidebar-active-bg' : ''">
                    <div class="flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 shrink-0">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
                        </svg>
                        <span *ngIf="!isCollapsed">Inventario</span>
                    </div>
                    <svg *ngIf="!isCollapsed" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform shrink-0"
                        [ngClass]="menuAbierto === 'inventario' ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>

                <div *ngIf="isCollapsed && menuColapsadoAbierto !== 'inventario'" 
                     class="fixed ml-14 -mt-10 px-3 py-1.5 bg-black text-white text-xs font-medium rounded-md opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-[9999] shadow-lg hidden group-hover:block">
                    Inventario
                    <div class="absolute top-1/2 -left-1.5 -translate-y-1/2 w-0 h-0 border-y-[6px] border-y-transparent border-r-[6px] border-r-black"></div>
                </div>

                <!-- Bandeja flotante -->
                <div *ngIf="isCollapsed && menuColapsadoAbierto === 'inventario'" 
                     class="fixed left-[5.2rem] -mt-11 w-48 bg-white rounded-xl shadow-lg border border-gray-100 p-2 z-[9999] flex flex-col gap-1">
                    <a href="#" class="px-4 py-2 text-sm text-gray-800 hover:bg-gray-100 rounded-lg transition-colors">Productos</a>
                    <a href="#" class="px-4 py-2 text-sm text-gray-800 hover:bg-gray-100 rounded-lg transition-colors">Categorías</a>
                </div>
            </div>

            <!-- Biblioteca -->
            <div class="relative group">
                <a href="#" class="flex items-center gap-3 px-3 py-3 rounded-lg transition-colors hover:bg-sidebar-hover-bg hover:text-sidebar-hover-text">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 shrink-0">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
                    </svg>
                    <span *ngIf="!isCollapsed">Biblioteca digital</span>
                </a>
                <div *ngIf="isCollapsed" 
                     class="fixed ml-14 -mt-10 px-3 py-1.5 bg-black text-white text-xs font-medium rounded-md opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-[9999] shadow-lg hidden group-hover:block">
                    Biblioteca digital
                    <div class="absolute top-1/2 -left-1.5 -translate-y-1/2 w-0 h-0 border-y-[6px] border-y-transparent border-r-[6px] border-r-black"></div>
                </div>
            </div>

            <div *ngIf="!isCollapsed" class="px-2 mt-6 mb-2">
                <p class="text-[.625rem] font-medium tracking-wider uppercase">Configuraciones</p>
            </div>

            <!-- Usuarios -->
            <div class="relative group">
                <a href="#" class="flex items-center gap-3 px-3 py-3 rounded-lg transition-colors hover:bg-sidebar-hover-bg hover:text-sidebar-hover-text">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 shrink-0">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
                    </svg>
                    <span *ngIf="!isCollapsed">Usuarios</span>
                </a>
                <div *ngIf="isCollapsed" 
                     class="fixed ml-14 -mt-10 px-3 py-1.5 bg-black text-white text-xs font-medium rounded-md opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-[9999] shadow-lg hidden group-hover:block">
                    Usuarios
                    <div class="absolute top-1/2 -left-1.5 -translate-y-1/2 w-0 h-0 border-y-[6px] border-y-transparent border-r-[6px] border-r-black"></div>
                </div>
            </div>

            <!-- Soporte -->
            <div class="relative group">
                <a href="#" class="flex items-center gap-3 px-3 py-3 rounded-lg transition-colors hover:bg-sidebar-hover-bg hover:text-sidebar-hover-text">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 shrink-0">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
                    </svg>
                    <span *ngIf="!isCollapsed">Soporte</span>
                </a>
                <div *ngIf="isCollapsed" 
                     class="fixed ml-14 -mt-10 px-3 py-1.5 bg-black text-white text-xs font-medium rounded-md opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity whitespace-nowrap z-[9999] shadow-lg hidden group-hover:block">
                    Soporte
                    <div class="absolute top-1/2 -left-1.5 -translate-y-1/2 w-0 h-0 border-y-[6px] border-y-transparent border-r-[6px] border-r-black"></div>
                </div>
            </div>

        </div>
    </div>
</aside>
